<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="관찰을 바탕으로 상사의 반응을 연습하고 말의 의도를 해석하는 AI 시뮬레이션" />
    <link rel="preload" as="image" href="/avatars/boss-male-01-loading.png" fetchpriority="high" />
    <style>
      html,body,#root{min-height:100%;margin:0}body{background:#fefefe;color:#5c5d75;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .initial-loading{min-height:100vh;display:grid;place-items:center;text-align:center}.initial-loading>div{display:grid;justify-items:center;gap:12px}.initial-loading img{width:150px;height:150px;object-fit:contain;image-rendering:pixelated}.initial-spinner{width:28px;height:28px;border:3px solid rgba(55,93,243,.16);border-top-color:#375df3;border-radius:50%;animation:initial-spin .9s linear infinite}.initial-loading p{margin:2px 0 0;font-size:14px}@keyframes initial-spin{to{transform:rotate(360deg)}}
    </style>
    <link rel="icon" href="/favicon.ico" />
    <title>상사어 번역기</title>
  </head>
  <body><div id="root"><div class="initial-loading" role="status" aria-label="서비스를 불러오는 중"><div><img src="/avatars/boss-male-01-loading.png" alt="모두의 상사 픽셀 아바타" width="150" height="150" fetchpriority="high"/><div class="initial-spinner" aria-hidden="true"></div><p>모두의 상사를 부르는 중입니다.</p></div></div></div><script type="module" src="/src/main.tsx"></script></body>
</html>
